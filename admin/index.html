  <title>The Secret Men Club - Executive Dashboard</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    body {
      font-family: 'Tajawal', sans-serif;
      margin: 0;
      overflow-x: hidden;
      letter-spacing: -0.01em;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    /* High-Energy Red Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #E53935;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #FF3B30;
    }

    .luxury-shadow {
      box-shadow: 0 15px 50px -10px rgba(0, 0, 0, 0.5);
    }

    .luxury-shadow-light {
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05);
    }

    /* Executive Animations */
    @keyframes breathing-red {

      0%,
      100% {
        opacity: 0.6;
        transform: scale(1);
      }

      50% {
        opacity: 1;
        transform: scale(1.05);
      }
    }

    @keyframes fade-in-up-stagger {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-breathing-red {
      animation: breathing-red 3s infinite ease-in-out;
    }

    .animate-fadeIn {
      animation: fadeIn 0.3s ease-in forwards;
    }

    .animate-slideUp {
      animation: slideUp 0.4s ease-out forwards;
    }

    .entry-stagger-1 {
      animation: fade-in-up-stagger 0.8s ease-out 0.1s forwards;
      opacity: 0;
    }

    .entry-stagger-2 {
      animation: fade-in-up-stagger 0.8s ease-out 0.2s forwards;
      opacity: 0;
    }

    .entry-stagger-3 {
      animation: fade-in-up-stagger 0.8s ease-out 0.3s forwards;
      opacity: 0;
    }

    .entry-stagger-4 {
      animation: fade-in-up-stagger 0.8s ease-out 0.4s forwards;
      opacity: 0;
    }

    .value-reveal {
      animation: fade-in-up-stagger 1s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
      opacity: 0;
    }

    ::selection {
      background: #E53935;
      color: #FFFFFF;
    }

    /* Smooth Theme Interpolation */
    .theme-transition {
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Sidebar Specific Ultra-Minimal Red Scrollbar */
    .sidebar-scroll::-webkit-scrollbar {
      width: 2px;
    }

    .sidebar-scroll::-webkit-scrollbar-track {
      background: transparent;
    }

    .sidebar-scroll::-webkit-scrollbar-thumb {
      background: rgba(229, 57, 53, 0.25);
      border-radius: 999px;
    }

    .sidebar-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(229, 57, 53, 0.55);
    }

    /* Firefox support for sidebar scrollbar */
    .sidebar-scroll {
      scrollbar-width: thin;
      scrollbar-color: rgba(229, 57, 53, 0.25) transparent;
    }
  </style>
