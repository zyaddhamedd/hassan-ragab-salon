  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Phosphor Icons CSS - Stable CDN -->
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Tajawal:wght@300;400;500;700&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Cairo', 'Tajawal', sans-serif;
      background-color: #121212;
      margin: 0;
      overflow-x: hidden;
    }

    /* ── 80mm Thermal Receipt Print Styles ── */
    @media print {
      @page {
        size: 80mm auto;
        margin: 0;
      }

      html,
      body {
        margin: 0 !important;
        padding: 0 !important;
        width: 80mm !important;
        height: auto !important;
        min-height: unset !important;
        overflow: visible !important;
        background: #fff !important;
        font-family: 'Cairo', 'Tajawal', sans-serif !important;
      }

      /* ── Step 1: blanket-hide every node in the page ── */
      body * {
        visibility: hidden;
      }

      /* ── Step 2: make only the receipt visible ── */
      .receipt-print,
      .receipt-print * {
        visibility: visible;
      }

      /* ── Step 3: pin the receipt to the top-left of the paper ── */
      .receipt-print {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 80mm !important;
        max-width: 80mm !important;
        padding: 4mm !important;
        margin: 0 !important;
        box-sizing: border-box !important;
        background: #fff !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        page-break-inside: avoid;
        break-inside: avoid;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      /* No overflow clipping on any receipt content */
      .receipt-print * {
        overflow: visible !important;
      }

      /* QR centred */
      .receipt-qr {
        display: flex !important;
        justify-content: center !important;
        align-items: center !important;
      }

      /* Hard-hide UI chrome (buttons, modal overlay etc.) */
      .no-print {
        display: none !important;
        visibility: hidden !important;
      }
    }

    .focus-gold:focus {
      outline: none;
      border-color: #E6D690;
      box-shadow: 0 0 10px rgba(230, 214, 144, 0.3);
    }

    .neon-red-shadow {
      box-shadow: 0 0 20px rgba(229, 57, 53, 0.4);
    }

    .neon-gold-text {
      text-shadow: 0 0 8px rgba(230, 214, 144, 0.5);
    }

    /* Luxury Animations */
    @keyframes soft-breath {

      0%,
      100% {
        transform: scale(1);
        opacity: 0.9;
      }

      50% {
        transform: scale(1.05);
        opacity: 1;
      }
    }

    .animate-breath {
      animation: soft-breath 3s ease-in-out infinite;
    }

    @keyframes select-pulse {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(0.95);
      }

      100% {
        transform: scale(1);
      }
    }

    .animate-select-pulse {
      animation: select-pulse 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .luxury-card-glow:hover {
      filter: drop-shadow(0 0 20px var(--glow-color));
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 5px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      border-radius: 10px;
      background: rgba(230, 214, 144, 0.1);
    }

    /* Fix for phosphor loading icons explicitly */
    .ph {
      display: inline-block;
      line-height: 1;
      text-transform: none;
      letter-spacing: normal;
      word-wrap: normal;
      white-space: nowrap;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      -moz-osx-font-smoothing: grayscale;
      font-feature-settings: 'liga';
    }
  </style>
