<!doctype html>
<html lang="ar" dir="rtl">
<head>

<title>Omar Admin — Coupon artifact V2</title>
<style>
:root{color-scheme:dark;--page:#162127;--gold:#d8b887;--secondary:#bdcbd1;--green:#16c784;--cut:polygon(20px 0,calc(100% - 40px) 0,calc(100% - 28px) 12px,100% 12px,100% calc(100% - 22px),calc(100% - 22px) 100%,14px 100%,0 calc(100% - 14px),0 20px)}
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:40px 20px;background:var(--page);color:#fff;font-family:Tahoma,Arial,sans-serif}main{width:min(100%,438px)}.artifact{position:relative;filter:drop-shadow(0 20px 25px #0005);transition:transform 200ms ease,filter 200ms ease}.frame{position:relative;padding:1px;clip-path:var(--cut);background:linear-gradient(125deg,#f2d7a7 0%,#9f845c 24%,#4b5354 47%,#71634f 77%,#dfc395 100%)}.housing{position:relative;clip-path:var(--cut);background:linear-gradient(135deg,#30434d 0%,#213039 40%,#19262e 100%);padding:25px 27px 16px;isolation:isolate}.housing:before{content:"";position:absolute;inset:13px auto 13px 10px;width:3px;background:linear-gradient(#e8ca98 0 22%,#6d6655 22% 24%,#b39a70 24% 30%,transparent 30% 69%,#6d6655 69% 76%,#d8b887 76% 100%);z-index:-1}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.code{font:700 20px/1.4 'Courier New',monospace;letter-spacing:.09em;margin:0;overflow-wrap:anywhere;color:#f5ead8}.status{display:inline-flex;align-items:center;gap:6px;border:1px solid #16c78455;background:#16c78412;color:#45e9aa;padding:5px 9px;border-radius:4px;font-size:10px;white-space:nowrap}.status:before{content:"";width:5px;height:5px;background:var(--green);border-radius:50%}.core{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:23px 0 21px}.value{display:flex;align-items:baseline;gap:5px;font-family:Arial,sans-serif;line-height:1;color:#fff;font-variant-numeric:lining-nums;position:relative}.number{font-size:102px;font-weight:800;letter-spacing:-7px}.percent{font-size:35px;font-weight:700;color:var(--gold);align-self:flex-start;padding-top:11px}.scope{border-right:2px solid var(--gold);padding:3px 12px 3px 0;max-width:150px}.scope strong{display:block;font-size:14px;line-height:1.7;color:#f7f4ee;font-weight:700}.scope span{display:block;color:var(--secondary);font-size:11px;line-height:1.8;margin-top:4px}.cutline{height:9px;display:flex;align-items:center;gap:5px;margin-bottom:14px;direction:ltr}.cutline:before{content:"";height:1px;background:#627078;flex:1}.cutline:after{content:"";width:28px;height:3px;transform:skewX(-35deg);background:var(--gold);box-shadow:9px 0 0 #d8b88755}.actions{display:grid;grid-template-columns:1fr 1fr 42px;gap:8px}.action{height:37px;border:1px solid #52616a;background:#263740;color:#e4e9ec;display:flex;align-items:center;justify-content:center;gap:7px;font:700 11px Tahoma,Arial,sans-serif;cursor:pointer;border-radius:3px;transition:background 150ms ease,border-color 150ms ease,color 150ms ease}.action svg{width:14px;height:14px;flex:none}.edit{border-color:#b49b72;background:linear-gradient(120deg,#e4c99f,#bfa070);color:#17232a}.pause{color:#ffc260}.archive{color:#ef5353}.action:hover{background:#344954;border-color:#8fa2ac}.edit:hover{background:#efd7b0;border-color:#f4dfbd}.pause:hover{background:#f5a62317;border-color:#f5a623}.archive:hover{background:#ef343419;border-color:#ef3434}.action:focus-visible,summary:focus-visible{outline:2px solid #fff;outline-offset:3px}.details{margin-top:14px;border-top:1px solid #43545f}.details summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;color:var(--secondary);font-size:10px;min-height:33px;padding-top:4px}.details summary::-webkit-details-marker{display:none}.details summary svg{width:12px;height:12px;transition:transform 180ms ease}.details[open] summary svg{transform:rotate(180deg)}.details summary:hover{color:var(--gold)}dl{display:grid;grid-template-columns:1fr 1fr;gap:13px 15px;margin:12px 0 9px;font-size:10px;line-height:1.8}dt{color:#a8bac4;margin-bottom:2px}dd{margin:0;color:#fff}.wide{grid-column:1/-1}#preview-info{max-width:calc(100vw - 40px);width:320px;background:#21323b;border:1px solid #a58d67;color:#fff;padding:24px;line-height:1.9;border-radius:8px;font-size:13px;box-shadow:0 20px 80px #0008}#preview-info::backdrop{background:#0005}#preview-info p{margin:0 0 16px}#preview-info button{width:100%}
@media(hover:hover){.artifact:hover{transform:translateY(-3px);filter:drop-shadow(0 24px 28px #0006)}}
@media(max-width:390px){body{padding:28px 16px}.housing{padding:25px 22px 15px}.number{font-size:86px;letter-spacing:-6px}.percent{font-size:29px}.core{gap:12px}.scope{padding-right:9px;max-width:130px}.scope strong{font-size:13px}.scope span{font-size:10px}.code{font-size:18px}}
@media(prefers-reduced-motion:reduce){.artifact,.action,.details summary svg{transition:none}.artifact:hover{transform:none}}
</style>
</head>
<body>
<main>

</div>
<details class="details"><summary>التفاصيل<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary><dl><div class="wide"><dt>الفروع</dt><dd>Omar Fahim Salon · الجيزة</dd></div><div><dt>بداية الصلاحية</dt><dd>١ نوفمبر ٢٠٢٦</dd></div><div><dt>نهاية الصلاحية</dt><dd>٣١ ديسمبر ٢٠٢٦</dd></div><div><dt>حد الاستخدام</dt><dd>100 مرة</dd></div><div><dt>الاستخدام الحالي</dt><dd>غير متاح</dd></div></dl></details>
</div></div>

</main>
</body></html>
