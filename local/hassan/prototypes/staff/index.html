<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#101d23"><link rel="icon" href="../../assets/mini-favicon.svg"><title>Omar Fahim — Staff Concept</title><link rel="stylesheet" href="style.css"></head><body data-theme="dark">
<div class="app"><header class="top"><img class="logo" src="../../assets/cashier-header-logo-white-tight.svg" alt="Omar Fahim Barber shop"><button class="icon-button theme-toggle" aria-label="تبديل المظهر"></button></header>
<main id="content"></main><nav class="navigation" aria-label="التنقل الرئيسي"></nav><div class="prototype-note">نموذج تصميم تفاعلي · بيانات توضيحية فقط</div></div>
<template id="home"><section class="view signature-home">
 <div class="home-identity"><div><p class="home-date">الخميس، ٢٩ أكتوبر</p><h1>أهلًا، أحمد<span>محمود</span></h1><div class="home-person"><span class="identity-stroke"></span>حلاق <span class="identity-separator">/</span> الجيزة</div></div><button class="home-avatar" data-go="profile" aria-label="الملف الشخصي لأحمد محمود"><span>أ م</span><span class="avatar-corner" data-icon="arrow"></span></button></div>
 <article class="signature-shift" aria-label="وردية اليوم — بيانات توضيحية">
  <div class="shift-head"><div class="shift-heading"><span class="shift-square"></span><h2>وردية اليوم</h2></div><span class="shift-state"><i></i>لم تُسجّل حضورك</span></div>
  <div class="shift-body"><div class="shift-schedule"><div class="schedule-point"><span class="schedule-dot"></span><div class="schedule-label">بداية الوردية</div><div class="schedule-clock"><bdi>12:00</bdi><span>ظهرًا</span></div></div><div class="schedule-point"><span class="schedule-dot hollow"></span><div class="schedule-label">نهاية الوردية</div><div class="schedule-clock"><bdi>09:00</bdi><span>مساءً</span></div></div></div><div class="shift-date"><span>OCT</span><strong>29</strong><span>الخميس</span><div class="date-rule"></div><span class="date-demo">وردية<br>توضيحية</span></div></div>
  <div class="shift-location"><span data-icon="pin"></span><span>Omar Fahim Salon <small>الجيزة</small></span></div>
  <button class="signature-attendance" data-go="attendance"><span class="attendance-fingerprint" data-icon="finger"></span><span class="attendance-copy"><strong>تسجيل الحضور</strong><small>استكشف تجربة الضغط المطوّل</small></span><span class="attendance-arrow" data-icon="arrow"></span></button>
 </article>
 <div class="home-requests"><div class="home-section-heading"><h2>طلب جديد</h2><button data-go="requests">طلباتي <span data-icon="arrow"></span></button></div><div class="request-rail"><button data-go="advance"><span class="request-symbol" data-icon="wallet"></span><strong>طلب سلفة</strong><span class="request-chevron" data-icon="arrow"></span></button><button data-go="leave"><span class="request-symbol" data-icon="calendar"></span><strong>طلب إجازة</strong><span class="request-chevron" data-icon="arrow"></span></button></div></div>
 <p class="home-simulation"><span data-icon="shield"></span>معاينة تصميم فقط · الحضور والطلبات غير فعلية</p>
</section></template>
<template id="attendance"><section class="view attendance-view"><div class="eyebrow">الحضور والانصراف</div><h1>تسجيل الحضور</h1><p class="subtle">اضغط مطولًا لاستكشاف التجربة.</p><div class="simulation"><span data-icon="shield"></span> محاكاة بصرية — لا يوجد تحقق أو تسجيل فعلي</div><div class="orb-wrap mechanical-control" data-stage="idle" data-pressed="false"><div class="orb-track" aria-hidden="true"></div><svg class="progress-ring" viewBox="0 0 260 260" aria-hidden="true"><circle cx="130" cy="130" r="120"/></svg><button id="hold" class="orb" aria-describedby="attendance-status" aria-label="اضغط مطولًا أو استمر بالضغط على مفتاح المسافة لتجربة الحضور"><span data-icon="finger"></span><strong id="orb-title">اضغط مطولًا</strong><small id="orb-caption">لتجربة تسجيل الحضور</small></button></div><div id="attendance-status" role="status" aria-live="polite" aria-atomic="true" class="attendance-status ignition-status">لا يتم استخدام موقعك أو إنشاء سجل حضور.</div><div class="simulation-options"><label class="demo-mode-label">محاكاة <select id="attendance-mode" aria-label="نوع محاكاة الحضور"><option value="checkin">حضور</option><option value="checkout">انصراف</option></select></label><button aria-pressed="true" data-result="success">نجاح</button><button aria-pressed="false" data-result="failure">تعذّر التحقق</button></div><button class="text-link" id="reset-attendance">إعادة التجربة</button></section></template>
<template id="requests"><section class="view"><div class="eyebrow">مساحتك</div><h1>طلباتي</h1><p class="subtle">أمثلة توضيحية لحالات الطلبات، وليست سجلات فعلية.</p><div class="tabs" role="group" aria-label="تصفية الطلبات"><button class="selected" data-filter="all">الكل</button><button data-filter="pending">قيد المراجعة</button><button data-filter="done">مكتملة</button></div><div id="request-list"></div><div class="quick-grid"><button class="outline-button" data-go="advance">طلب سلفة جديد</button><button class="outline-button" data-go="leave">طلب إجازة جديد</button></div></section></template>
<template id="profile"><section class="view"><div class="eyebrow">حسابك</div><h1>الملف الشخصي</h1><div class="profile-identity"><div class="avatar">أ</div><h2>أحمد محمود</h2><p class="subtle">حلاق · هوية توضيحية</p><span class="badge">Omar Fahim Salon · الجيزة</span></div><div class="settings"><div><span data-icon="sun"></span><span>المظهر<small id="theme-name"></small></span><button class="theme-toggle outline-button">تبديل</button></div><div><span data-icon="shield"></span><span>الجهاز الشخصي<small>غير متصل — نموذج تصميم فقط</small></span></div><div><span data-icon="info"></span><span>عن هذه النسخة<small>لا تسجيل دخول، ولا اتصال بالخادم</small></span></div></div></section></template>
<script src="app.js"></script></body></html>
